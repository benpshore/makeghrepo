[project]
name = "makeghrepo-beta"
version = "0.1.0b1"
description = "Isolated experimental project planning and generation for makeghrepo."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "copier>=9.18.2",
    "gitpython>=3.1.62",
    "typer>=0.27.2",
]

[project.scripts]
makeghrepo-beta = "makeghrepo_beta:main"

[build-system]
requires = ["hatchling>=1.32,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/makeghrepo_beta"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/hatch_build.py", "/shared-files.json", "/pyproject.toml", "/README.md"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
extend = "../pyproject.toml"
