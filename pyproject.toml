[project]
name = "makeghrepo"
dynamic = ["version"]
description = "Create a new, fully configured GitHub repo for any language in one command."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Ben Shore" }
]
requires-python = ">=3.14"
dependencies = [
    "copier>=9.18.2",
    "gitpython>=3.1.62",
    "typer>=0.27.2",
]

[project.urls]
Repository = "https://github.com/benpshore/makeghrepo"

[project.scripts]
makeghrepo = "makeghrepo:main"

[build-system]
requires = ["hatchling>=1.32,<2", "uv-dynamic-versioning>=0.14,<1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/makeghrepo"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
extend-exclude = ["src/makeghrepo/templates"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = [
    "S311",  # random is for repo names, not crypto
    "S603",  # we intentionally shell out to gh/uv with arg lists
    "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/makeghrepo/names.py" = ["SIM905"]  # word lists read better as split strings

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["slow: renders a project and runs uv lock/sync/lint/test inside it (needs network)"]
