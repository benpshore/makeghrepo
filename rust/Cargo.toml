[package]
name = "makeghrepo"
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
description = "Create a new, fully configured GitHub repo for any language in one command."
license = "MIT"
repository = "https://github.com/benpshore/makeghrepo"
publish = false

[[bin]]
name = "makeghrepo"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
include_dir = "0.7"
minijinja = { version = "2", features = ["custom_syntax", "preserve_order"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = { version = "1", features = ["preserve_order"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
