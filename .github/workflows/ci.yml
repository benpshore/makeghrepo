name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job name "ci" is a required status check in the branch ruleset.
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Install
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check --output-format=github
      - name: Test
        run: uv run pytest
      # Snapshots are rendered here, not on a dev machine, and uploaded so a PR
      # that changes output on purpose can commit them (see README "Golden snapshots").
      - name: Render golden snapshots
        if: ${{ !cancelled() }}
        run: uv run scripts/regen-golden --out out/golden
      - name: Upload golden snapshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden
          path: out/golden
          if-no-files-found: error
      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command
      - name: Build
        run: uv build
      - name: Install as a uv tool and smoke test
        run: |
          uv tool install dist/*.whl
          makeghrepo --help
