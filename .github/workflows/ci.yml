name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer push to a PR branch supersedes its run. Pushes to main don't: every
  # merge commit must get its own complete ci result (auto-release waits for it).
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Install
        run: uv sync --locked
      - name: Format
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check --output-format=github
      - name: Test
        run: uv run pytest
      # Snapshots are rendered here, not on a dev machine, and uploaded so a PR
      # that changes output on purpose can commit them (see README "Golden snapshots").
      - name: Render golden snapshots
        if: ${{ !cancelled() }}
        run: uv run scripts/regen-golden --out out/golden
      - name: Upload golden snapshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: golden
          path: out/golden
          if-no-files-found: error
      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command
      - name: Build
        run: uv build
      - name: Install as a uv tool and smoke test
        run: |
          uv tool install dist/*.whl
          makeghrepo --help

  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - id: matrix
        run: echo "matrix=$(uv run scripts/ci-matrix)" >> "$GITHUB_OUTPUT"

  # Every combo from tests/golden_snapshots.py is rendered and its generated
  # project's own local checks run here on real toolchains, never on a dev host.
  templates:
    name: templates (${{ matrix.combo }}, ${{ matrix.os }})
    needs: plan
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      # The runner images ship no `bundle` on PATH; the ruby combos need it for their lockfile.
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.4"
      # macOS runners have no Docker daemon, so the docker checks skip there anyway.
      - name: Install hadolint 2.15.1 (checksum-verified)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/hadolint" \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64
          echo "c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507  $RUNNER_TEMP/bin/hadolint" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/hadolint"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: uv sync --locked
      # `all` runs three times: the local checks run concurrently, so a rare
      # ordering race between setup steps and checks shows up as a flake here.
      - name: Render the combo and run its checks
        env:
          COMBO: ${{ matrix.combo }}
        run: |
          runs=1
          [ "$COMBO" = all ] && runs=3
          for i in $(seq "$runs"); do
            echo "::group::render-check $COMBO ($i/$runs)"
            uv run scripts/render-check "$COMBO"
            echo "::endgroup::"
          done

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Install actionlint 1.7.12 (checksum-verified)
        run: |
          curl -sSfL -o actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
      - name: Lint makeghrepo's own workflows
        run: ./actionlint
      - name: Lint every generated workflow
        run: |
          uv run scripts/render-check --all rendered
          ./actionlint rendered/*/.github/workflows/*.yml

  # The Rust port (rust/): built and checked here, never on a dev host. Its
  # parity gate renders every tests/golden combo and compares byte for byte
  # with the Python renderer's snapshots.
  rust:
    name: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          cargo --version && rustc --version
      - name: Lockfile
        run: |
          if [ ! -f Cargo.lock ]; then
            echo "::warning::rust/Cargo.lock is missing; generating it (commit the artifact)"
            cargo generate-lockfile
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cargo-lock
          path: rust/Cargo.lock
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Parity with the Python renderer (every golden snapshot)
        run: |
          set -euo pipefail
          n=0
          for f in ../tests/golden/*.golden; do
            combo=$(basename "$f" .golden)
            if ! ./target/release/makeghrepo --snapshot --combo "$combo" | cmp - "$f"; then
              echo "::error::rust render differs from tests/golden/$combo.golden"
              ./target/release/makeghrepo --snapshot --combo "$combo" | diff -u "$f" - | head -80 || true
              exit 1
            fi
            n=$((n + 1))
          done
          echo "$n golden snapshots reproduced byte for byte by the Rust build"
      - name: Dry run
        run: |
          ./target/release/makeghrepo quiet-otter rust docker --render "$RUNNER_TEMP/dry" >/dev/null
          test -f "$RUNNER_TEMP/dry/Cargo.toml" && test -f "$RUNNER_TEMP/dry/Dockerfile"
          ./target/release/makeghrepo --version
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      # Last, so one cloud round reports compile, test and parity results together
      # with the format patch (nothing is formatted on a dev host).
      - name: Format
        id: fmt
        run: |
          if ! cargo fmt --check; then
            cargo fmt
            git diff -- . > "$RUNNER_TEMP/rustfmt.patch"
            echo "::error::rustfmt wants changes; apply the rustfmt-patch artifact"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.fmt.outcome == 'failure'
        with:
          name: rustfmt-patch
          path: ${{ runner.temp }}/rustfmt.patch

  # The single required check in the branch ruleset ("ci"): passes only if every job above passed.
  ci:
    name: ci
    if: always()
    needs: [test, plan, templates, actionlint, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = false
