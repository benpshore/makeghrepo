name: Owner push validation
on:
  push:
    branches: [fix/owner-direct-push]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7
      - run: uv sync --locked
      - run: uv run ruff format
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo +stable fmt --manifest-path rust/Cargo.toml
      - run: uv run scripts/regen-golden
      - name: Save formatted sources and generated snapshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: owner-push-prepared
          path: |
            rust/src/github.rs
            src/makeghrepo/github.py
            tests/test_owner_push.py
            tests/test_github.py
            tests/test_template.py
            tests/golden/*.golden
          if-no-files-found: error
          retention-days: 2
      - run: uv run ruff check
      - run: uv run pytest -m 'not slow'
