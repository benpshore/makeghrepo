name: One open PR

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, edited, synchronize, closed, ready_for_review, converted_to_draft]
  # GITHUB_TOKEN-created PRs may suppress pull_request events; reconcile all open
  # PRs on the default branch periodically and on explicit recovery dispatches.
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-open-pr-${{ github.repository_id }}
  cancel-in-progress: false
  queue: max

jobs:
  reconcile:
    if: >-
      github.repository == 'benpshore/makeghrepo' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # For these guarded events github.sha is the trusted default-branch
          # commit, never a PR head/merge commit. Do not use head.ref/head.sha.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Audit repository PR inventory
        env:
          GH_TOKEN: ${{ github.token }}
          # Both this switch and reviewed policy.mode must enable writes.
          # This PR deliberately leaves both disabled pending parent review.
          ONE_OPEN_PR_APPLY: "0"
        run: node .github/one-open-pr/reconcile.mjs
