name: Build and publish release

# Both entry points use this graph. Write authority exists only on the fresh
# publisher runner, which never checks out or executes project code. A failed
# Python build or any failed native target prevents publication entirely.
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      SOURCE: ${{ inputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Prepare the exact version locally
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          if git rev-parse --verify "refs/tags/v$VERSION" >/dev/null 2>&1; then
            test "$(git rev-parse "v$VERSION^{commit}")" = "$SOURCE"
          else
            git -c user.name=CI -c user.email=ci@example.invalid tag -a "v$VERSION" -m "v$VERSION"
          fi
      - name: Git identity for tests
        run: |
          git config --global user.name CI
          git config --global user.email ci@example.invalid
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv audit --locked --preview-features audit-command
      - run: uv build
      - name: Verify package metadata and record inventory
        run: python3 scripts/release-inventory python dist "$VERSION" "$SOURCE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-python
          path: dist/*
          if-no-files-found: error

  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      VERSION: ${{ inputs.version }}
      SOURCE: ${{ inputs.sha }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
      - name: Build and verify the installed CLI version
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE"
          MAKEGHREPO_VERSION="$VERSION" cargo build --release --locked --manifest-path rust/Cargo.toml --target "$TARGET"
          mkdir dist
          bin="makeghrepo-$TARGET"
          cp "rust/target/$TARGET/release/makeghrepo" "dist/$bin"
          test "$("./dist/$bin" --version)" = "makeghrepo $VERSION"
          (cd dist && shasum -a 256 "$bin" > "$bin.sha256")
          python3 scripts/release-inventory "$TARGET" dist "$VERSION" "$SOURCE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [python, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      SOURCE: ${{ inputs.sha }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
          digest-mismatch: error
      # This inline verifier belongs to the reviewed workflow, not downloaded
      # repository code. Inventories are data: fixed names, source/version,
      # size and digest must agree before any publication request. The job's
      # token already has write authority; only reviewed workflow code runs here.
      - name: Verify complete immutable artifact set
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, re
          from pathlib import Path
          version, source = os.environ["VERSION"], os.environ["SOURCE"]
          assert re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version)
          assert re.fullmatch(r"[a-f0-9]{40}", source)
          root = Path("dist")
          slots = ["python", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
          expected = set()
          assets = []
          for slot in slots:
              inventory = root / (slot + ".json")
              expected.add(inventory.name)
              data = json.loads(inventory.read_text())
              assert data["version"] == version and data["source"] == source
              names = {a["name"] for a in data["assets"]}
              if slot == "python":
                  assert names == {f"makeghrepo-{version}-py3-none-any.whl", f"makeghrepo-{version}.tar.gz"}
              else:
                  assert names == {"makeghrepo-" + slot, "makeghrepo-" + slot + ".sha256"}
              for asset in data["assets"]:
                  path = root / asset["name"]
                  assert path.is_file() and not path.is_symlink()
                  content = path.read_bytes()
                  assert len(content) == asset["size"] and len(content) > 0
                  assert hashlib.sha256(content).hexdigest() == asset["sha256"]
                  expected.add(path.name)
                  assets.append(asset)
          assert {p.name for p in root.iterdir()} == expected
          # Only verified payloads enter the upload directory; inventories stay
          # private workflow evidence rather than becoming release attachments.
          payload = Path("payload")
          payload.mkdir()
          for asset in assets:
              (root / asset["name"]).rename(payload / asset["name"])
          Path("expected-assets.json").write_text(json.dumps(assets))
          PYCODE
      - name: Tag, upload draft, then publish all artifacts together
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          verify_remote_assets() {
            # gh resolves drafts through GraphQL, then REST by numeric ID.
            # The REST tag endpoint only supports published releases.
            gh release view "$tag" --json databaseId,tagName > release-lookup.json
            release_id=$(jq -er --arg tag "$tag" \
              'select(.tagName == $tag) | .databaseId | select(type == "number" and . > 0 and . == floor)' release-lookup.json)
            gh api "repos/$GH_REPO/releases/$release_id" > release.json
            RELEASE_ID="$release_id" EXPECTED_DRAFT="$1" python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          expected = json.loads(Path("expected-assets.json").read_text())
          release = json.loads(Path("release.json").read_text())
          assert type(release["id"]) is int and release["id"] == int(os.environ["RELEASE_ID"])
          assert release["tag_name"] == "v" + os.environ["VERSION"]
          assert type(release["draft"]) is bool
          assert release["draft"] == (os.environ["EXPECTED_DRAFT"] == "true")
          assert release["prerelease"] is False
          actual = release["assets"]
          assert {a["name"] for a in actual} == {a["name"] for a in expected}
          for wanted in expected:
              found = next(a for a in actual if a["name"] == wanted["name"])
              assert found["size"] == wanted["size"]
              assert found.get("digest") == "sha256:" + wanted["sha256"]
          PYCODE
          }
          # Allocation collisions fail rather than retag a different commit.
          if gh api "repos/$GH_REPO/git/ref/tags/$tag" > ref.json 2>/dev/null; then
            type=$(jq -r .object.type ref.json)
            sha=$(jq -r .object.sha ref.json)
            while [ "$type" = tag ]; do
              gh api "repos/$GH_REPO/git/tags/$sha" > ref.json
              type=$(jq -r .object.type ref.json)
              sha=$(jq -r .object.sha ref.json)
            done
            test "$type" = commit && test "$sha" = "$SOURCE"
          else
            # Preserve annotated release tags for Git versioning consumers;
            # the ref names an immutable tag object peeled to the checked source.
            object=$(gh api --method POST "repos/$GH_REPO/git/tags" \
              -f tag="$tag" -f message="$tag" -f object="$SOURCE" -f type=commit --jq .sha)
            gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$tag" -f sha="$object"
          fi
          if gh release view "$tag" --json isDraft --jq .isDraft > draft.txt 2>/dev/null; then
            # Never clobber a public release on retry. Require its full remote
            # digest/size inventory; an older incomplete release needs explicit
            # human repair rather than pretending this attempt completed it.
            if [ "$(cat draft.txt)" != true ]; then
              verify_remote_assets false
              exit 0
            fi
          else
            gh release create "$tag" --draft --verify-tag --target "$SOURCE" --generate-notes
          fi
          gh release upload "$tag" payload/* --clobber
          verify_remote_assets true
          # Both authorized callers hold the same workflow concurrency queue
          # across this read/compare/PATCH sequence. Legacy selection is date-
          # based, so compare every published stable version numerically and
          # send an explicit true/false decision. Invalid/ambiguous evidence
          # leaves the complete release as a draft. GitHub has no documented
          # conditional release PATCH: publishers outside this queue can race
          # this decision and must be coordinated separately.
          gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" > release-pages.json
          make_latest=$(RELEASE_ID="$release_id" python3 - <<'PYCODE'
          import json, os, re
          from pathlib import Path
          pages = json.loads(Path("release-pages.json").read_text())
          assert type(pages) is list and pages
          stable = re.compile(r"v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)")
          tag = "v" + os.environ["VERSION"]
          candidate = tuple(map(int, stable.fullmatch(tag).groups()))
          release_id = int(os.environ["RELEASE_ID"])
          ids, tags, published = set(), set(), []
          found = False
          for page in pages:
              assert type(page) is list
              for release in page:
                  assert type(release) is dict
                  rid, name = release["id"], release["tag_name"]
                  assert type(rid) is int and rid > 0 and rid not in ids
                  assert type(name) is str and name and name not in tags
                  assert type(release["draft"]) is bool
                  assert type(release["prerelease"]) is bool
                  ids.add(rid)
                  tags.add(name)
                  if rid == release_id:
                      assert name == tag and release["draft"] and not release["prerelease"]
                      found = True
                  else:
                      assert name != tag
                  if release["draft"] or release["prerelease"]:
                      continue
                  version = stable.fullmatch(name)
                  assert version is not None, "published release has an unrecognized stable tag"
                  published.append(tuple(map(int, version.groups())))
          assert found, "candidate draft missing from release catalog"
          print("true" if all(candidate >= version for version in published) else "false")
          PYCODE
          )
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" \
            -f tag_name="$tag" -F draft=false -f make_latest="$make_latest" --silent
