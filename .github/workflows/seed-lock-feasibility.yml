name: Seed lock feasibility

on:
  push:
    branches: [agent/olga/packaged-python-lock]

permissions:
  contents: read

jobs:
  seed-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          python-version: "3.14.8"
      - run: uv sync --locked
      - name: Generate and exercise a seed for two project identities
        run: uv run scripts/seed-lock-feasibility
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-seed-lock-feasibility
          path: |
            out/seed-lock-feasibility/python-uv.lock.jinja
            out/seed-lock-feasibility/provenance.json
          if-no-files-found: error
