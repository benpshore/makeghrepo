name: Release

# Manual fallback only: every ordinary merge to main is released automatically
# by auto-release.yml, which tags the merged commit before this workflow ever
# sees a ref. The one thing that workflow can't do for itself is recover if it
# pushes that tag but then fails before publishing the GitHub release (network
# blip, `gh release create` hiccup, etc.) — the tag already exists at that
# point, so re-pushing it is a no-op that fires nothing here. For that case,
# run this workflow by hand against the existing tag:
#   gh workflow run release.yml --ref vX.Y.Z
#
# `version` is dynamic (`uv-dynamic-versioning`, derived from git tags — see
# pyproject.toml), so a manually-pushed tag is also a fully valid way to cut a
# release by hand: nothing else needs bumping or committing first, and
# auto-release.yml only reacts to pushes on `main`, not to tags, so it won't
# collide with one.
#
# Keep the checkout/setup-uv/test/audit/build steps and pinned action SHAs
# below in sync with auto-release.yml's. The build runs on a read-only runner;
# only a fresh runner that consumes its artifact receives release permission.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
      - name: Tag matches computed project version
        run: test "$(uvx uv-dynamic-versioning)" = "${GITHUB_REF_NAME#v}"
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run pytest
      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist

  release:
    name: release
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-dist
          path: dist
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
