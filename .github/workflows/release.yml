name: Release

# Manual/tag recovery shares the entire build and publication pipeline with
# auto-release. A partial attempt remains a draft until every artifact exists;
# recovery uses the existing tag's exact source instead of allocating a bump.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: auto-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: python3 scripts/release-version --tag "$TAG" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.plan.outputs.version }}
      sha: ${{ needs.plan.outputs.sha }}
