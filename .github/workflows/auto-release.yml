name: Auto-release

# Every merge to main is a release: tag it and publish a GitHub release with
# built artifacts. No one has to remember to do this by hand, which is what
# let makeghrepo drift at v0.1.0 forever while `main` moved on underneath it
# (#15) — `uv tool upgrade` had no new version to notice.
#
# main is protected by the "protect-main" ruleset (#20): PRs required, `ci`
# required to pass. A prior version of this workflow tried to satisfy that by
# opening its own release PR and dispatching ci.yml onto it by hand. That
# turned out not to work: **verified live (2026-09-27) that a PR opened with
# GITHUB_TOKEN never gets a real CI run at all** — GitHub's anti-recursion
# rule means the check-suite for that PR's `pull_request` event is created
# but never actually scheduled (confirmed: the run had zero jobs). A
# workflow_dispatch run on the same branch *did* complete successfully and
# attach its check-run to the right commit, but the ruleset's merge-gate still
# never recognized it (mergeStateStatus stayed BLOCKED, statusCheckRollup
# stayed empty, for the full test window). Reopening the same PR under a real
# user identity fixed it instantly — conclusive evidence the gap is real, not
# a propagation delay.
#
# The actual fix is to not need a PR at all: `version` is dynamic
# (`uv-dynamic-versioning`, derived from git tags — see pyproject.toml), not a
# committed field, so a release doesn't touch any tracked file. It's just a
# tag on a commit that already merged through a real PR and already passed
# `ci` — which is a *stronger* guarantee than the old committed-version-bump
# design ever had. Tags aren't covered by protect-main (`target: "branch"`),
# so pushing one needs no PR, no bypass, and no PAT.
#
# Considered and declined: a PAT so the release PR would open under a real
# identity and get real CI (this is the standard fix for the platform gap
# above). Declined by the repo owner — didn't want to hold a personal access
# token as a repo secret for this.
#
# This checks out the exact commit that triggered the run (`github.sha`), not
# the mutable `main` ref, so a second push landing on main mid-run can't cause
# this run to tag the wrong commit.
#
# Tests and builds run in read-only jobs with checkout credentials disabled.
# The write-enabled jobs only create refs or publish previously built artifacts;
# they never execute dependency, test, build, or generated binary code.
#
# The release job first waits for this commit's `ci` check-run to succeed, so a
# red merge (found live: v0.16.0 was tagged on a commit whose CI failed) is
# never released; re-run this workflow by hand after the fix lands if needed.
#
# release.yml stays as the manual fallback for the one thing this can't
# recover from itself: the tag gets pushed but `gh release create` then fails
# (network blip, etc.). Run it by hand against the existing tag in that case.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-release
  cancel-in-progress: false
  # Keep up to 100 pending releases instead of replacing the previous pending
  # run. FIFO is by queue entry, not commit order; overflow runs are canceled.
  queue: max

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: check
        # Already tagged (a manual re-dispatch with nothing new merged since,
        # or a re-run after this run's own tag push already succeeded) — a
        # release for this exact commit already exists, nothing to do.
        run: |
          set -euo pipefail
          if [ -n "$(git tag --points-at HEAD 'v*')" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: validate
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # A merge to main runs ci.yml and this workflow at the same time. Never
      # tag a commit whose required `ci` check hasn't passed: a release is a
      # promise that CI was green on exactly this commit.
      - name: Wait for this commit's ci check
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 75); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=ci&per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // "pending"')
            case "$state" in
              success) echo "ci passed on $SHA"; exit 0 ;;
              pending) sleep 20 ;;
              *) echo "::error::ci concluded '$state' on $SHA; not releasing it"; exit 1 ;;
            esac
          done
          echo "::error::timed out waiting for ci on $SHA"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run pytest
      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command
      - name: Build
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          IFS=. read -r major minor _patch <<<"${latest#v}"
          version="${major:-0}.$((${minor:-0} + 1)).0"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Tagged locally before building: uv-dynamic-versioning reads the
          # tag reachable from HEAD, so this makes the built wheel exactly
          # "vX.Y.Z", not a "+devN" snapshot version.
          git tag -a "v$version" -m "v$version"
          uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: dist/

  release:
    name: release
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tag
        id: tag
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v*' --sort=-v:refname | head -1)"
          IFS=. read -r major minor _patch <<<"${latest#v}"
          version="${major:-0}.$((${minor:-0} + 1)).0"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$version" -m "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Push tag
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" \
            push origin "refs/tags/v$VERSION"
      - uses: actions/download-artifact@608c4c26717a59437d7bca00f4a3d1f0f06a1ff3 # v8.0.1
        with:
          name: python-dist
          path: dist/
      - name: Publish
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* --verify-tag --generate-notes

  # The Rust port's prebuilt binaries, attached to the release just published:
  # Linux x86_64, Linux aarch64 (the Pi) and macOS arm64, each with a sha256 file.
  # Compiled here so no development host ever has to.
  binaries:
    name: binaries (${{ matrix.target }})
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
      - name: Build
        working-directory: rust
        run: MAKEGHREPO_VERSION="$VERSION" cargo build --release --locked --target "$TARGET"
      - name: Checksum
        run: |
          set -euo pipefail
          bin="makeghrepo-$TARGET"
          cp "rust/target/$TARGET/release/makeghrepo" "$bin"
          shasum -a 256 "$bin" | tee "$bin.sha256"
          "./$bin" --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-${{ matrix.target }}
          path: |
            makeghrepo-${{ matrix.target }}
            makeghrepo-${{ matrix.target }}.sha256

  publish-binaries:
    name: publish binaries
    needs: [release, binaries]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@608c4c26717a59437d7bca00f4a3d1f0f06a1ff3 # v8.0.1
        with:
          pattern: binary-*
          path: binaries/
          merge-multiple: true
      - name: Attach binaries
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: gh release upload "v$VERSION" binaries/* --clobber
