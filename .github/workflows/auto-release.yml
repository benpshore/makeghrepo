name: Auto-release

# A main push selects one stable minor version for its exact source. The queue
# serializes allocation through publication. No branch bump/PR/PAT is needed:
# dynamic Python versions and the Rust compile-time version use the same tag.
# Re-dispatch retries an existing source tag, including an unpublished draft.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-release
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - name: Wait for this commit's ci check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 75); do
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?check_name=ci&per_page=100" \
              --jq '[.check_runs[] | select(.app.slug == "github-actions")] | sort_by(.started_at) | last | .conclusion // "pending"')
            case "$state" in
              success) exit 0 ;;
              pending) sleep 20 ;;
              *) echo "::error::ci concluded '$state' on $SHA; not releasing it"; exit 1 ;;
            esac
          done
          echo "::error::timed out waiting for ci on $SHA"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: Select the source's stable version
        run: python3 scripts/release-version >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: write
    with:
      version: ${{ needs.plan.outputs.version }}
      sha: ${{ needs.plan.outputs.sha }}
