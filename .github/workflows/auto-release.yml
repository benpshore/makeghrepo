name: Auto-release

# Every merge to main is a release: bump the minor version, tag it, and publish
# a GitHub release with built artifacts. No one has to remember to do this by
# hand, which is what let makeghrepo drift at v0.1.0 forever while `main` moved
# on underneath it (#15) — `uv tool upgrade` had no new version to notice.
#
# main is now protected by the "protect-main" ruleset (#20): PRs required, `ci`
# required to pass, no direct pushes. So this workflow can no longer push a
# release commit straight to main (GH013 rejects it) — it opens a PR for its
# own bump commit instead, same as a human would, and squash-merges it once
# `ci` passes.
#
# GITHUB_TOKEN PRs have a wrinkle: GitHub's anti-recursion rule means events
# *triggered by* GITHUB_TOKEN don't start new workflow runs — so ci.yml's
# normal `pull_request` trigger never fires on this PR, and the required `ci`
# check never reports. `workflow_dispatch` is explicitly exempted from that
# rule, so this workflow dispatches ci.yml onto its own release branch by hand
# and waits for that run. Verified live (2026-09-27): a workflow_dispatch
# run's check-run attaches to the dispatched branch's exact head SHA under the
# GitHub Actions app (id 15368) — the same thing required_status_checks looks
# for — so it satisfies the PR's required check exactly as if ci.yml had
# triggered on its own. The same anti-recursion rule means the eventual squash
# merge to main triggers nothing further either, which is *why* the guard job
# below can't just react to "a new push landed" — see its own comment.
#
# Considered and declined: a bypass_actors entry on the ruleset letting this
# workflow's actor push straight past the PR requirement. Rejected because it
# would exempt the release commit from the same CI gate every other change on
# this repo has to clear — the whole point of #20 — for a config change riskier
# to reason about than the dispatch dance above.
#
# Requires "Allow GitHub Actions to create and approve pull requests" enabled
# under Settings → Actions → General (done 2026-09-27) — GITHUB_TOKEN can't
# open PRs at all otherwise. No PAT/secret needed: everything here runs as
# GITHUB_TOKEN.
#
# The merge and the tag/publish are two separate, non-atomic steps (unlike the
# old single `git push --atomic`), because the merge now has to go through
# GitHub's own merge machinery, and this job can die (timeout, runner
# eviction, a transient gh/network failure) anywhere between them. If it dies
# after merging but before tagging, main is left with a "chore: release
# vX.Y.Z" commit and no matching tag — worse, because the merge was performed
# with GITHUB_TOKEN, that commit landing on main triggers no new workflow run
# at all, so nothing re-checks it on its own. There's no "next push will
# notice" safety net here: recovery has to be re-triggered by hand
# (`gh workflow run auto-release.yml --ref main` — NOT the Actions UI's
# "Re-run failed jobs", which reuses the guard job's already-computed output
# instead of re-evaluating current state) whenever `uv tool upgrade` doesn't
# show a version bump you expected.
#
# The guard job is built around that: it doesn't look at commit messages at
# all (an earlier version did, and could get permanently blinded the moment
# any other commit landed on top of a stuck release commit before guard next
# ran). Instead it checks the one fact that actually matters and can't drift:
# does a tag exist for main's CURRENT pyproject.toml version? Yes → that
# version already shipped, bump to a new one (mode=full). No → that version
# was bumped but never tagged/published — finish it from main's current tip,
# no re-bump, no new PR (mode=publish-only). This is correct regardless of
# what else has landed on main since, because nothing but this workflow ever
# touches the version field.
#
# Build happens twice on purpose: once pre-flight (fail fast, don't open a PR
# that can only fail later) and once after the merge, from the actual merged
# commit — so the published dist/* always matches what's really on main, not
# a pre-merge snapshot.
#
# release.yml stays as a manual fallback (see its own header) for the one
# thing even this can't reach: recovering a release whose *tag* was already
# pushed but whose GitHub Release publish step then failed.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      mode: ${{ steps.check.outputs.mode }} # full | publish-only
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - id: check
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version = "(.*)"/\1/p' pyproject.toml)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if out=$(gh api "repos/${{ github.repository }}/git/ref/tags/v$version" 2>&1); then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          elif [[ "$out" == *"HTTP 404"* ]]; then
            echo "mode=publish-only" >> "$GITHUB_OUTPUT"
          else
            echo "::error::couldn't check whether tag v$version exists: $out" >&2
            exit 1
          fi

  release:
    name: release
    needs: guard
    if: needs.guard.outputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump minor version
        id: bump
        run: |
          uv version --bump minor --no-sync
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run pytest
      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command
      - name: Build
        run: uv build
      - name: Open release PR
        id: pr
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          # Unique per run (not just per version) so a retry after a prior
          # attempt died mid-flight can never collide with it — no stale
          # branch/PR to detect or clean up, at the cost of a harmless orphan
          # branch left behind on the rare attempt that doesn't complete.
          branch="release/v$VERSION-$GITHUB_RUN_ID"
          git checkout -b "$branch"
          git add pyproject.toml uv.lock
          git commit -m "chore: release v$VERSION"
          git push origin "$branch"
          url="$(gh pr create --base main --head "$branch" \
            --title "chore: release v$VERSION" \
            --body "Automated version bump. Merges itself once \`ci\` passes on this branch.")"
          echo "number=${url##*/}" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Dispatch ci on the release branch
        env:
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: |
          set -euo pipefail
          gh workflow run ci.yml --ref "$BRANCH"
          # The dispatch API call is fire-and-forget; the run takes a few
          # seconds to appear. The branch name is unique to this run (above),
          # so nothing else can ever match it — no stale-run risk here.
          run_id=""
          for _ in $(seq 1 10); do
            run_id="$(gh run list --workflow=ci.yml --branch="$BRANCH" --event=workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$run_id" ] && break
            sleep 3
          done
          if [ -z "$run_id" ]; then
            echo "::error::dispatched ci run never appeared for $BRANCH" >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status
      - name: Merge once ci passes
        id: merge
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          # ci already passed (previous step); this just waits out GitHub's
          # own short lag in recomputing mergeability from that check before
          # actually performing the squash merge. Nothing is left "armed" if
          # this job dies here — either the merge below succeeds, or it
          # doesn't happen at all, so there's no unattended in-flight state.
          for _ in $(seq 1 20); do
            if gh pr merge "$NUMBER" --squash --delete-branch \
                --subject "chore: release v$VERSION" --body ""; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::PR #$NUMBER never became mergeable" >&2
          exit 1
      - name: Build from the merged commit
        env:
          NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          # The exact merge commit, not the `main` ref: main can move again
          # between the merge above and this step, and building/tagging
          # whatever happens to be at `main` by then would publish the wrong
          # commit as this version.
          sha="$(gh pr view "$NUMBER" --json mergeCommit --jq .mergeCommit.oid)"
          git fetch origin "$sha"
          git checkout "$sha"
          uv build
      - name: Tag and publish
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -euo pipefail
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "refs/tags/v$VERSION"
          gh release create "v$VERSION" dist/* --verify-tag --generate-notes

  # Reached when a prior run's release commit landed on main but the run died
  # before tagging/publishing it (see the header comment). No bump, no PR —
  # just finish releasing whatever main's tip already is.
  publish-only:
    name: publish-only
    needs: guard
    if: needs.guard.outputs.mode == 'publish-only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Build
        run: uv build
      - name: Tag and publish
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "v$VERSION"
          git push origin "refs/tags/v$VERSION"
          gh release create "v$VERSION" dist/* --verify-tag --generate-notes
