name: Release

# Tag a version to publish: bump with `uv version --bump patch`, merge the PR,
# then `git tag v$(uv version --short) && git push --tags`.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Tag matches project version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - name: Install
        run: uv sync --locked
      - name: Test
        run: uv run pytest
      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command
      - name: Build
        run: uv build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
